name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_PASSWORD: ci-test-password
      JWT_SECRET: ci-test-secret-not-for-real-use
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -v

      - name: Import-check the full app (catches wiring/circular-import errors)
        run: python -c "import app.main; print(f'{len(app.main.app.routes)} routes registered')"

  fuzz:
    # Part D6/C8: "fuzz every decoder, put results in CI" -- separate job
    # from backend-tests so a fuzz failure is clearly attributed to hostile
    # input handling, not a regular unit test regression. Each of the ~15
    # property tests runs 300 Hypothesis examples by default (see
    # tests/fuzz/test_parser_fuzzing.py); this already found and fixed a
    # real bug (parse_json() returning a non-dict for bare JSON literals
    # like "false") the first time it ran.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_PASSWORD: ci-test-password
      JWT_SECRET: ci-test-secret-not-for-real-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fuzz every decoder (cef/leef/syslog/xml/csv/kv/json) + full pipeline
        run: timeout 300 python -m pytest tests/fuzz -v

  dependency-audit:
    # Part C8: dependency vulnerability audit as its own CI stage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          # PYSEC-2026-3929 (transformers): the only release that fixes it,
          # 5.10.0, is yanked from PyPI -- its own yank note reads "pushed
          # from a week old main branch... uncertain it's gonna be working
          # properly and mostly it is missing a bunch of fixes." Shipping a
          # release the maintainers themselves pulled back is a worse
          # security posture than the one CVE it would fix, so this is
          # explicitly, visibly ignored here rather than silently left to
          # fail CI forever or fixed by installing something broken. Every
          # other finding pip-audit has surfaced (57, as of 2026-09-29) has
          # been fixed for real -- see backend/requirements.txt's own
          # per-package comments for what was bumped and why. Re-check this
          # exclusion whenever a non-yanked fix for transformers ships.
          #
          # CVE-2026-80047 / GHSA-x9r9-c232-4q39 (transformers): a genuinely
          # new advisory (not an alias of PYSEC-2026-3929 above) found live
          # when this CI check started failing after no code change on our
          # side -- external advisory databases update independently of
          # this repo. No fix version exists yet (pip-audit's own
          # fix_versions field is empty for it). The vulnerability only
          # manifests through GenerativePreTrainedModel.load_custom_generate()
          # writing an untrusted remote module to disk before its own
          # trust_remote_code consent check runs -- confirmed via a direct
          # repo-wide grep that neither load_custom_generate nor
          # trust_remote_code is called anywhere in this codebase (the only
          # real transformers usage here is SentenceTransformer's plain
          # encode() for field-mapping embeddings, a different code path
          # entirely). Re-check this exclusion once a fix version ships.
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-3929 --ignore-vuln CVE-2026-80047
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Lint
        run: npm run lint
