name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_PASSWORD: ci-test-password
      JWT_SECRET: ci-test-secret-not-for-real-use
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -v

      - name: Import-check the full app (catches wiring/circular-import errors)
        run: python -c "import app.main; print(f'{len(app.main.app.routes)} routes registered')"

  fuzz:
    # Part D6/C8: "fuzz every decoder, put results in CI" -- separate job
    # from backend-tests so a fuzz failure is clearly attributed to hostile
    # input handling, not a regular unit test regression. Each of the ~15
    # property tests runs 300 Hypothesis examples by default (see
    # tests/fuzz/test_parser_fuzzing.py); this already found and fixed a
    # real bug (parse_json() returning a non-dict for bare JSON literals
    # like "false") the first time it ran.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_PASSWORD: ci-test-password
      JWT_SECRET: ci-test-secret-not-for-real-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fuzz every decoder (cef/leef/syslog/xml/csv/kv/json) + full pipeline
        run: timeout 300 python -m pytest tests/fuzz -v

  dependency-audit:
    # Part C8: dependency vulnerability audit as its own CI stage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Lint
        run: npm run lint
