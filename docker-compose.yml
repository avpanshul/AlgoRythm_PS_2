version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ulp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ulp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ulp_password}
      POSTGRES_DB: ${POSTGRES_DB:-ulp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulp -d ulp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ulp-network

  minio:
    image: minio/minio
    container_name: ulp-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ulp-network

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: ulp-opensearch
    environment:
      - cluster.name=ulp-cluster
      - node.name=os-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - ulp-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: ulp-os-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      - ulp-network
    depends_on:
      - opensearch

  redis:
    image: redis:7-alpine
    container_name: ulp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ulp-network

  redpanda:
    image: docker.redpanda.com/vectorized/redpanda:latest
    container_name: ulp-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - ulp-network

  ollama:
    image: ollama/ollama
    container_name: ulp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ulp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulp-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_started
      opensearch:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - ulp-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulp-worker
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
    networks:
      - ulp-network
    command: python -m app.workers.main

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ulp-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ulp-network
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  minio_data:
  opensearch_data:
  redis_data:
  redpanda_data:
  ollama_data:

networks:
  ulp-network:
    driver: bridge
