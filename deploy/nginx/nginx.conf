# TLS-terminating reverse proxy in front of the API and frontend.
#
# This is the TLS boundary for docker-compose.prod.yml: backend and frontend
# are not published on host ports in that file, only this proxy is. Supply a
# real certificate for production (from your real/internal CA -- see
# docs/PKI.md). For a self-contained demo/air-gapped test, this project's own
# throwaway dev CA (ULPF-master-prompt.md Part D2) already issues a server
# cert usable here:
#
#   bash deploy/dev-ca/generate.sh
#   cp deploy/dev-ca/server.crt deploy/nginx/certs/fullchain.pem
#   cp deploy/dev-ca/server.key deploy/nginx/certs/privkey.pem
#
# and accept the browser warning (it's a throwaway CA, not a publicly trusted
# one), or import deploy/dev-ca/ca.crt as a trusted local CA to avoid the
# warning. This does not add mutual TLS to this proxy -- that's deliberately
# scoped to the syslog collector path instead (app/workers/syslog_listener.py
# --tls-cert/--tls-key/--tls-ca), since this proxy serves the browser
# frontend and the JWT-authenticated API, not untrusted log-sending devices.
# See docs/PKI.md for the full picture and what a real deployment needs
# beyond this dev CA (key ceremony, rotation, HSM-backed root key storage).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 6m;  # a little above the app's own 5 MB request-body guard

    server {
        listen 80;
        server_name _;
        # Plaintext HTTP exists only to redirect -- nothing is ever served over it.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:5173/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
