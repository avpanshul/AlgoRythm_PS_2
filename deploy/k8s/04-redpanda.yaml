apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redpanda-data
  namespace: ulpf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: ulpf
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          # Real bug found on a live cluster: `vectorized/redpanda` is a
          # retired org path (404s -- "not found"), not just an old tag.
          # The real current org is `redpandadata`; pinned rather than
          # `:latest` since the org rename itself proves floating refs to
          # third-party paths can silently break.
          image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
          args:
            - redpanda
            - start
            - --smp
            - "1"
            - --reserve-memory
            - "0M"
            - --overprovisioned
            - --node-id
            - "0"
            - --kafka-addr
            - "PLAINTEXT://0.0.0.0:9092"
            - --advertise-kafka-addr
            - "PLAINTEXT://redpanda:9092"
          ports:
            - containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redpanda-data
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: ulpf
spec:
  selector:
    app: redpanda
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda-allow-app-only
  namespace: ulpf
spec:
  podSelector:
    matchLabels:
      app: redpanda
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: worker } }
      ports:
        - port: 9092
