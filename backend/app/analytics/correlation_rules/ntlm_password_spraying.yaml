# Real detection pattern for T1110.003 (Password Spraying): many distinct
# target accounts authenticated-against from the same real-world source in a
# short window. Scoped to `correlate_by: source_id` rather than an actor IP
# or hostname, because the real event type this exists to catch (Windows
# Event ID 8004, Microsoft-Windows-NTLM/Operational) records the target
# account and workstation name, not a reliable actor-identifying IP --
# an honest limitation of the real data, not an invented shortcut. A single
# ingested source seeing many distinct target accounts hit in a short window
# is itself the real spraying signature, independent of attacker identity.
id: ntlm_password_spraying
name: "Password spraying (many distinct target accounts, short window)"
description: >
  Many distinct target usernames authenticated against from one source
  within the window -- the real signature of password spraying (try one
  password against many accounts, rather than many passwords against one
  account), as opposed to a classic single-account brute force.
window_minutes: 10
severity: high
correlate_by: source_id
min_distinct_sources: 1
stages:
  - name: spraying
    match:
      any_event: true
    min_count: 10
    min_distinct_user_names: 5
